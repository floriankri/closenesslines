<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A collection of lives, traced through their relationships.">
<meta name="referrer" content="no-referrer">
<title>Gallery · Closeness Lines</title>
<link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="./site.css">
<style>
:root{color-scheme:light;--paper:#f7f4eb;--ink:#24241f;--muted:#5f5a51;--rule:#d4cec0;--accent:#a33d2d;--ui:system-ui,sans-serif;--serif:Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 var(--serif)}
a{color:inherit;text-underline-offset:.28em}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(1080px,calc(100% - 48px));margin-inline:auto}
h1,p{margin:0}
.heading{padding:24px 0 17px}
.filters{display:flex;align-items:end;justify-content:space-between;flex-wrap:wrap;gap:8px 18px;padding:13px 0;border-bottom:1px solid var(--rule)}
.age-range{display:flex;align-items:end;gap:8px;flex-wrap:wrap}
.age-range label{display:grid;gap:5px}
.label{font:650 .68rem/1.5 var(--ui);letter-spacing:.12em;text-transform:uppercase}
button,input{min-height:40px;border:1px solid var(--rule);border-radius:2px;background:var(--paper);color:inherit;padding:7px 10px;font:500 .88rem var(--ui)}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--ink)}
input{width:76px}
#gallery-status{color:var(--muted);margin-top:16px;font:500 .86rem/1.5 var(--ui)}
#gallery-status:empty{display:none}
#items{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),210px));justify-content:start;gap:14px;padding:0;margin:16px 0}
.timeline-card{display:block;padding:7px;border:1px solid var(--rule);text-decoration:none}
.timeline-card:hover{border-color:var(--ink)}
.timeline-card svg{display:block;width:100%;height:auto;max-width:210px;background:#f0ebdf}
.timeline-card span{display:block;margin:5px 3px 1px}
.timeline-card .tagline{margin:8px 3px 3px;color:var(--muted);font:400 .95rem/1.35 var(--serif);white-space:pre-line}
.timeline-card .created{margin:7px 3px 2px;color:var(--muted);font:500 .66rem/1.4 var(--ui);letter-spacing:.08em;text-transform:uppercase}
.line-tooltip{position:fixed;z-index:5;max-width:230px;padding:6px 9px;background:var(--paper);border:1px solid var(--rule);border-radius:2px;box-shadow:0 2px 8px #24241f12;pointer-events:none;font:600 .76rem/1.4 var(--ui)}
#more{margin-bottom:24px}
[hidden]{display:none!important}
@media(max-width:680px){#items{justify-content:center}.wrap{width:calc(100% - 28px)}button,input{min-height:44px}input{font-size:16px}}
@media(min-width:681px){
  .heading{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
}
</style>
</head>
<body>
<main class="wrap">
<header class="site-masthead">
  <a class="site-brand" href="./index.html">Closeness Lines</a>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="./index.html">Home</a>
    <a href="./creator.html">Creator</a>
    <a href="./gallery.html" aria-current="page">Gallery</a>
  </nav>
</header>
<div class="heading"><h1 class="site-title">Gallery</h1></div>
<div class="filters">
  <form class="age-range" id="age-filter" aria-label="Filter timelines by age">
    <label><span class="label">Min age</span><input name="minAge" type="number" min="0" max="200" step="1" inputmode="numeric"></label>
    <label><span class="label">Max age</span><input name="maxAge" type="number" min="0" max="200" step="1" inputmode="numeric"></label>
    <button type="submit">Filter</button>
  </form>
  <a class="label" href="./index.html">Example · The People We Keep</a>
</div>
<p id="gallery-status" role="status" aria-live="polite">Loading timelines…</p>
<ul id="items" aria-label="Shared timelines"></ul>
<button type="button" id="more" hidden>Load more</button>
<div id="line-tooltip" class="line-tooltip" role="tooltip" hidden></div>
<noscript><p>Enable JavaScript to see shared timelines.</p></noscript>
</main>
<script src="./config.js"></script>
<script src="./api.js"></script>
<script src="./timeline-plot.js"></script>
<script>
'use strict';
const form = document.getElementById('age-filter');
const status = document.getElementById('gallery-status');
const items = document.getElementById('items');
const more = document.getElementById('more');
const tooltip = document.getElementById('line-tooltip');
const dismissTooltip = event => {
  if (event.type === 'pointerdown' && event.target.closest?.('.plot-hit')) return;
  tooltip.hidden = true;
};
document.addEventListener('scroll', dismissTooltip, true);
document.addEventListener('pointerdown', dismissTooltip, true);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') tooltip.hidden = true;
});
let filters = {};
let nextCursor;
let activeRequest;
const formatCreated = value => {
  const date = typeof value === 'string' ? new Date(value) : null;
  return date && Number.isFinite(date.getTime())
    ? new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'long', year: 'numeric' }).format(date)
    : '';
};

function addCard(item) {
  if (!ClosenessAPI.validId(item.publicId)) return;
  const row = document.createElement('li');
  const link = document.createElement('a');
  link.className = 'timeline-card';
  link.href = ClosenessAPI.timelineURL(item.publicId);
  const plot = ClosenessPlot.node('svg', { 'aria-hidden': true, focusable: false });
  ClosenessPlot.render(plot, { age: item.age, duration: item.duration, lines: ClosenessPlot.publicLines(item.lines), events: item.events ?? [], preview: true, tooltip });
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = `Age ${item.age}`;
  link.append(plot, label);
  if (item.tagline) {
    const tagline = document.createElement('span');
    tagline.className = 'tagline';
    tagline.textContent = item.tagline;
    link.append(tagline);
  }
  const created = formatCreated(item.createdAt);
  if (created) {
    const createdLabel = document.createElement('span');
    createdLabel.className = 'created';
    createdLabel.textContent = `Created ${created}`;
    link.append(createdLabel);
  }
  row.append(link);
  items.append(row);
}

async function loadGallery(append = false) {
  activeRequest?.abort();
  const controller = new AbortController();
  activeRequest = controller;
  more.disabled = true;
  if (!append) {
    items.replaceChildren();
    nextCursor = undefined;
    more.hidden = true;
  }
  status.textContent = 'Loading timelines…';
  try {
    const query = append ? { ...filters, cursor: nextCursor } : filters;
    const result = await ClosenessAPI.gallery(query, controller.signal);
    if (activeRequest !== controller) return;
    result.items.forEach(addCard);
    nextCursor = result.nextCursor;
    more.hidden = !nextCursor;
    status.textContent = items.children.length ? '' : Object.keys(filters).length
      ? 'No shared timelines match these ages.' : 'No timelines have been shared yet.';
  } catch (error) {
    if (activeRequest !== controller || error.name === 'AbortError') return;
    status.textContent = error.message;
  } finally {
    if (activeRequest === controller) more.disabled = false;
  }
}

form.addEventListener('submit', event => {
  event.preventDefault();
  const entries = [...new FormData(form)].filter(([, value]) => value !== '');
  const next = Object.fromEntries(entries);
  if (next.minAge !== undefined && next.maxAge !== undefined && Number(next.minAge) > Number(next.maxAge)) {
    activeRequest?.abort();
    activeRequest = undefined;
    more.disabled = false;
    status.textContent = 'Enter a maximum age at least as large as the minimum age.';
    return;
  }
  filters = next;
  loadGallery();
});
more.addEventListener('click', () => {
  if (nextCursor) loadGallery(true);
});
loadGallery();
</script>
</body>
</html>
